name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project sites live at /<repo>/. A user site (name.github.io) or a
      # custom domain (detected by a committed public/CNAME) lives at the root.
      - name: Work out the Pages base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io || -f public/CNAME ]]; then
            echo "VITE_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=$repo" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      # GitHub Pages has no SPA rewrites. Serving index.html as 404.html keeps
      # deep links like /work and /contact working on a hard refresh.
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository on the first run, so no manual
          # Settings > Pages step is needed.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
